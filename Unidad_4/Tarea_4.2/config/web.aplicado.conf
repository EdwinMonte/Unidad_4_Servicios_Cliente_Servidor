server {
    listen 10.44.0.10:80;
    server_name web.empresa.test www.empresa.test;
    return 308 https://web.empresa.test$request_uri;
}

server {
    listen 10.44.0.10:443 ssl;
    server_name web.empresa.test www.empresa.test;
    root /var/www/unidad4;
    index index.php;

    ssl_certificate /etc/unidad4/pki/web.crt;
    ssl_certificate_key /etc/unidad4/pki/web.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        try_files $uri $uri/ /index.php;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    location ~ \.php$ {
        return 404;
    }
}
