# FTPS explícito en la interfaz de laboratorio.
listen=YES
listen_ipv6=NO
listen_address=10.44.0.10
listen_port=21
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=077
chroot_local_user=YES
user_sub_token=$USER
local_root=/srv/u4transfer/$USER
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd-u4
userlist_enable=YES
userlist_deny=NO
userlist_file=/etc/vsftpd-u4.users
pasv_enable=YES
port_enable=NO
pasv_min_port=40000
pasv_max_port=40009
ssl_enable=YES
force_local_logins_ssl=YES
force_local_data_ssl=YES
ssl_sslv2=NO
ssl_sslv3=NO
ssl_tlsv1=NO
rsa_cert_file=/etc/unidad4/pki/web.crt
rsa_private_key_file=/etc/unidad4/pki/web.key
xferlog_enable=YES
