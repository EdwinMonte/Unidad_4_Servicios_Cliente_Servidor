dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap lmtp
listen = 10.44.0.10
mail_driver = maildir
mail_path = ~/Maildir
first_valid_uid = 1000
auth_mechanisms = plain login
auth_username_format = %{user | username | lower}

ssl = required
ssl_min_protocol = TLSv1.2
ssl_server_cert_file = /etc/ssl/certs/u4-mail.crt
ssl_server_key_file = /etc/ssl/private/u4-mail.key

passdb pam {
    service_name = dovecot-u4
}
userdb passwd {
}

service imap-login {
    inet_listener imap {
        port = 0
    }
    inet_listener imaps {
        port = 993
        ssl = yes
    }
}

service auth {
    unix_listener /var/spool/postfix/private/auth {
        mode = 0660
        user = postfix
        group = postfix
    }
}

service lmtp {
    unix_listener /var/spool/postfix/private/dovecot-lmtp {
        mode = 0600
        user = postfix
        group = postfix
    }
}

protocol lmtp {
    postmaster_address = postmaster@empresa.test
}
