# Equivalencia de referencia para ISC DHCP. El laboratorio usa Kea.
default-lease-time 600;
max-lease-time 600;
subnet 10.44.0.0 netmask 255.255.255.0 {
    range 10.44.0.100 10.44.0.150;
    option domain-name-servers 10.44.0.10;
    option domain-name "empresa.test";
}
host cliente-fedora {
    hardware ethernet 00:0c:29:19:b5:f5;
    fixed-address 10.44.0.50;
}
